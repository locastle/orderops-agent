[project]
name = "orderops-shared"
version = "0.1.0"
description = "Shared domain models and tool contracts for orderops-agent"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orderops_shared"]

[project]
name = "orderops-synthetic"
version = "0.1.0"
description = "Deterministic synthetic data and corpus generator for orderops-agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orderops-shared",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orderops_synthetic"]

[tool.uv.sources]
orderops-shared = { workspace = true }
